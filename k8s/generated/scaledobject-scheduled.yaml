apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: demo-scheduled
  namespace: autoscale-lab
spec:
  scaleTargetRef:
    name: demo-app
  minReplicaCount: 2
  maxReplicaCount: 12
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 0
  triggers:
  - type: cron
    metadata:
      timezone: UTC
      start: "8 8 * * *"
      end: "10 8 * * *"
      desiredReplicas: "3"
  - type: cron
    metadata:
      timezone: UTC
      start: "10 8 * * *"
      end: "11 8 * * *"
      desiredReplicas: "4"
  - type: cron
    metadata:
      timezone: UTC
      start: "11 8 * * *"
      end: "13 8 * * *"
      desiredReplicas: "5"
  - type: cron
    metadata:
      timezone: UTC
      start: "13 8 * * *"
      end: "16 8 * * *"
      desiredReplicas: "4"
  - type: cron
    metadata:
      timezone: UTC
      start: "16 8 * * *"
      end: "17 8 * * *"
      desiredReplicas: "3"
  - type: cron
    metadata:
      timezone: UTC
      start: "17 8 * * *"
      end: "18 8 * * *"
      desiredReplicas: "4"
  - type: cron
    metadata:
      timezone: UTC
      start: "18 8 * * *"
      end: "20 8 * * *"
      desiredReplicas: "6"
  - type: cron
    metadata:
      timezone: UTC
      start: "20 8 * * *"
      end: "21 8 * * *"
      desiredReplicas: "3"
